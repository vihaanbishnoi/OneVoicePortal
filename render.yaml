# Uses an existing/external PostgreSQL database; no paid resources are provisioned here.
services:
  - type: web
    name: onevoice-portal
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_DEPLOYMENT
        value: "1"
      - key: ALLOW_SHARED_HR_LOGIN
        value: "0"
      - key: DEMO_ENABLED
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
      - key: JOB_KEY
        generateValue: true
